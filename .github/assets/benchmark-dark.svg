<text x="668" y="317.0" font-size="12.5" fill="#8a8980">362 tokens</text>
<text x="856" y="317.0" font-size="13" font-weight="700" text-anchor="end" fill="#3987e5">1.8× smaller</text>
<text x="24" y="368" font-size="11" fill="#8a8980">Pass rate is a tie (30/31 each) and Playwright MCP&#8217;s best recorded run is faster. Raw JSON and protocol: test-hardest/BENCHMARK-PROTOCOL.md</text>
